<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Hệ Thống Điểm Danh</title>

<style>
*{
    box-sizing:border-box;
    font-family: "Segoe UI", sans-serif;
    transition: background 0.3s, color 0.3s;
}

:root{
    --bg:#f3f6fb;
    --card:#ffffff;
    --text:#1e293b;
    --sub:#64748b;
    --primary:#2563eb;
}

body.dark{
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f1f5f9;
    --sub:#94a3b8;
    --primary:#3b82f6;
}

body{
    margin:0;
    background:var(--bg);
}

header{
    background:var(--primary);
    color:white;
    padding:20px;
    text-align:center;
    font-size:22px;
    font-weight:600;
    position:relative;
}

.theme-toggle{
    position:absolute;
    right:20px;
    top:20px;
    cursor:pointer;
    font-size:18px;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:var(--card);
    padding:20px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    margin-bottom:25px;
}

h2{
    margin-top:0;
    font-size:18px;
    color:var(--text);
}

input{
    width:100%;
    padding:8px 10px;
    border-radius:8px;
    border:1px solid #d1d5db;
    font-size:14px;
    margin-top:5px;
    background:white;
}

body.dark input{
    background:#334155;
    border:1px solid #475569;
    color:white;
}

input:focus{
    outline:none;
    border-color:var(--primary);
}

.row{
    margin-bottom:14px;
}

button{
    padding:6px 12px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:13px;
    margin-right:6px;
}

.btn-primary{ background:var(--primary); color:white; }
.btn-success{ background:#16a34a; color:white; }
.btn-danger{ background:#dc2626; color:white; }
.btn-copy{ background:#64748b; color:white; }

.link-display{
    font-size:12px;
    color:var(--sub);
    margin-top:4px;
    word-break:break-all;
}

.hidden{ display:none; }

.login-box{
    max-width:400px;
    margin:80px auto;
    background:var(--card);
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,0.08);
    text-align:center;
}
</style>
</head>

<body>

<header>
📊 HỆ THỐNG QUẢN LÝ ĐIỂM DANH
<span class="theme-toggle" onclick="toggleTheme()">🌙</span>
</header>

<div id="loginBox" class="login-box">
    <h2>Đăng nhập quản trị</h2>
    <input type="password" id="adminPass" placeholder="Nhập mật khẩu">
    <br><br>
    <button class="btn-primary" onclick="login()">Đăng nhập</button>
</div>

<div id="adminPanel" class="container hidden">
    <button class="btn-success" onclick="addMonth()">➕ Thêm tháng</button>
    <div id="months"></div>
</div>

<script>
const PASSWORD = "123456";
let data = JSON.parse(localStorage.getItem("attendanceData")) || [];

// THEME
function toggleTheme(){
    document.body.classList.toggle("dark");
    let isDark = document.body.classList.contains("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    document.querySelector(".theme-toggle").textContent = isDark ? "☀" : "🌙";
}

// Load theme khi mở web
window.onload = function(){
    let savedTheme = localStorage.getItem("theme");
    if(savedTheme === "dark"){
        document.body.classList.add("dark");
        document.querySelector(".theme-toggle").textContent = "☀";
    }
};

// DATA
function saveData(){
    localStorage.setItem("attendanceData", JSON.stringify(data));
}

function login(){
    let pass = document.getElementById("adminPass").value;
    if(pass === PASSWORD){
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("adminPanel").classList.remove("hidden");
        render();
    } else alert("Sai mật khẩu!");
}

function addMonth(){
    let name = prompt("Nhập tháng (VD: 04/2026)");
    if(!name) return;
    data.unshift({name:name, links:{}});
    saveData();
    render();
}

function deleteMonth(index){
    if(confirm("Xóa tháng này?")){
        data.splice(index,1);
        saveData();
        render();
    }
}

function updateLink(index,key,value){
    data[index].links[key] = value;
    saveData();
}

function copyLink(value){
    if(!value) return alert("Chưa có link!");
    navigator.clipboard.writeText(value);
    alert("Đã copy!");
}

function render(){
    let container = document.getElementById("months");
    container.innerHTML="";

    data.forEach((month,index)=>{
        let card=document.createElement("div");
        card.className="card";

        card.innerHTML=`
        <h2>Tháng ${month.name}</h2>
        ${createRow(index,"k67","Khối 6 & 7")}
        ${createRow(index,"k8","Khối 8")}
        ${createRow(index,"k9","Khối 9")}
        ${createRow(index,"k10","Khối 10")}
        ${createRow(index,"k11","Khối 11")}
        ${createRow(index,"k12","Khối 12")}
        ${createRow(index,"clb","CLB")}
        <button class="btn-danger" onclick="deleteMonth(${index})">Xóa tháng</button>
        `;

        container.appendChild(card);
    });
}

function createRow(index,key,label){
    let value = data[index].links[key] || "";

    return `
    <div class="row">
        <strong>${label}</strong>
        <input value="${value}" 
        oninput="updateLink(${index},'${key}',this.value)">
        <div>
            <button class="btn-copy" onclick="copyLink('${value}')">Copy</button>
            <a href="${value}" target="_blank">
                <button class="btn-primary">Mở</button>
            </a>
        </div>
        <div class="link-display">${value}</div>
    </div>
    `;
}
</script>

</body>
</html>
